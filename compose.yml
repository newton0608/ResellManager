services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      private:
        ipv4_address: 172.29.213.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  resellmanager:
    image: resellmanager:v1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORT: "443"
      ReverseProxy__KnownProxy: 172.29.213.2
      AllowedHosts: ${AllowedHosts:?Configure AllowedHosts in .env}
      ConnectionStrings__ResellManager: ${ConnectionStrings__ResellManager:?Configure SQLite in .env}
      AlmacenamientoComprobantes__DirectorioBase: ${AlmacenamientoComprobantes__DirectorioBase:?Configure receipt storage in .env}
      DataProtection__KeysPath: ${DataProtection__KeysPath:?Configure persistent keys in .env}
    volumes:
      - /opt/resellmanager/data/database:/app/data/database
      - /opt/resellmanager/data/comprobantes:/app/data/comprobantes
      - /opt/resellmanager/data/dataprotection:/app/data/dataprotection
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.213.0/28

volumes:
  caddy_data:
  caddy_config:
